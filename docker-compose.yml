version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: watchtower-db
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower_secret
      POSTGRES_DB: aicte_watchtower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: watchtower-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: watchtower-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchtower-backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://watchtower:watchtower_secret@db:5432/aicte_watchtower
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - APP_ENV=demo
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: watchtower-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
